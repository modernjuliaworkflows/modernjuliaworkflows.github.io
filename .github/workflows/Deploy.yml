name: Build and Deploy
on:
  push:
    branches:
      - main
  pull_request:

# One run per branch; never cancel a main deploy mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the built site to gh-pages
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          # The committed tools/ZolaPreprocessor Manifest is resolved for 1.12.
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate the preprocessor
        run: julia --project=tools/ZolaPreprocessor -e 'using Pkg; Pkg.instantiate()'
      - name: Execute src/ into content/
        # Section envs (src/*/Project.toml) are instantiated per page by the
        # preprocessor itself; their Manifests are not committed.
        run: julia --project=tools/ZolaPreprocessor -m ZolaPreprocessor preprocess src content
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.3
      - name: Build the site
        run: zola build
      - name: Check links
        # Fails on any broken link not explicitly whitelisted in zola.toml's
        # [link_checker] (known-dead pages, uncheckable GitHub README anchors).
        run: zola check
      - name: Deploy to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
