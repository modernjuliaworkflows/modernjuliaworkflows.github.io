# Zola configuration (https://www.getzola.org/documentation/getting-started/configuration/).
# Requires Zola 0.23 (giallo-based highlighting keys, Tera 2 templates/components).
base_url = "https://modernjuliaworkflows.org"
title = "Modern Julia Workflows"
description = "Blog posts on best practices for Julia development"
default_language = "en"

# Keep the feed at /feed.xml, the URL the Franklin site used.
generate_feeds = true
feed_filenames = ["feed.xml"]

compile_sass = false
build_search_index = false

[markdown]
# Fences are highlighted at build time; executed REPL fences arrive from
# tools/ZolaPreprocessor as pre-rendered HTML and are styled by css/ansi.css.
[markdown.highlighting]
theme = "github-dark"
# Put data-lang on the <pre> so CSS can render language label chips.
data_attr_position = "pre"

[link_checker]
# Known-broken external links, whitelisted individually (verified 2026-08-13)
# so `zola check` still fails on any *new* breakage, external or internal.
skip_prefixes = [
    # Intentionally fake example URL in the prose.
    "https://github.com/myuser/",
    # Real page; intel.com returns 403 to non-browser clients.
    "https://www.intel.com/",
    # Genuinely dead (pre-existing content rot; fixing these is a content change):
    "https://www.julia-vscode.org/docs/stable/userguide/compilesysimage/",
    "https://github.com/cpfiffer",
    "https://github.com/adambard/learnxinyminutes-docs/blame/",
]
skip_anchor_prefixes = [
    # GitHub prefixes heading ids with `user-content-`, so README anchors can
    # never be verified by the checker (the linked targets do exist).
    "https://github.com/",
    # Genuine anchor drift: pages restructured after the links were written.
    "https://julialang.org/downloads/",
    "https://pkgdocs.julialang.org/",
]

[extra]
author = "G. Dalle, J. Smit, A. Hill"
